spring.application.name=solorecord-backend
spring.config.import=optional:file:.env[.properties]
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}


spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
app.cors.allowed-origins=http://localhost:5173

app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.full-name=${SUPER_ADMIN_NAME:Super Admin}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}
app.super-admin.phone=${SUPER_ADMIN_PHONE:0000000000}

app.notification.brevo.api-key=${BREVO_API_KEY:}
app.notification.sender-email=${NOTIFICATION_SENDER_EMAIL:}
app.notification.sender-name=${NOTIFICATION_SENDER_NAME:SoloRecord}
app.notification.retry.max-attempts=${NOTIFICATION_RETRY_ATTEMPTS:3}
app.notification.retry.initial-delay-ms=${NOTIFICATION_RETRY_DELAY_MS:5000}
